name: Check Intel internships

on:
  schedule:
    - cron: "*/30 * * * *"   # check every 30 min (you're only notified on new jobs)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send test notification
        if: ${{ inputs.test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_jobs.py --test
      - name: Check for new jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_jobs.py
      - name: Save seen jobs
        run: |
          git config user.name "job-notifier-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
